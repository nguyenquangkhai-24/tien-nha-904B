name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pip-audit

      - name: Backend dependency audit
        run: pip-audit -r backend/requirements.txt

      - name: Backend tests
        run: PYTHONPATH=. python -m unittest discover -s backend/tests -v

      - name: Secret scan
        run: python scripts/check_secrets.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend build
        working-directory: frontend
        run: pnpm build

      - name: Production dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
